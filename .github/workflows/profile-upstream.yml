name: Verify live upstream digest and native profile

on:
  push:
    branches: [design/live-contributions-v1]
    paths:
      - README.md
      - scripts/profile_upstream.py
      - tests/test_profile_upstream.py
      - .github/workflows/profile-upstream.yml
  workflow_dispatch:
  schedule:
    # Runs only after the design is approved and merged into the default branch.
    - cron: '23 * * * *'  # hourly once merged onto the default branch

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run self-contained offline tests
        run: python -m unittest discover -s tests -p 'test_profile_upstream.py' -v
      - name: Check live public upstream discovery (no commit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/profile_upstream.py

  refresh:
    # Preview branches update on their own pushes; schedules run on default branch only.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/design/'))
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: profile-upstream-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh all public upstream PR statuses
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/profile_upstream.py
      - name: Commit only when the README changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(profile): refresh selected upstream PR statuses'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
